name: Spectral CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Run Unit Test Suite
        run: go test -v -race ./...

      - name: Build Binary
        run: go build -v -o spectral ./cmd/spectral

      - name: Self-Scan Test
        run: ./spectral -path . -no-banner
