name: Spectral CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Run Unit Test Suite
        run: go test -v -race ./...

      - name: Build Binary
        run: go build -v -o spectral ./cmd/spectral

      - name: Self-Scan Verification
        run: ./spectral -path . -no-banner
